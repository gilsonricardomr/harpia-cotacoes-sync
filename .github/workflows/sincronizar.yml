name: Sincronizar Cotações

on:
  schedule:
    # 09h15 BRT = 12h15 UTC — BCB + Café/Milho
    - cron: '11 8 * * 1-5'
    # 10h17 BRT = 13h17 UTC — Soja + Boi Gordo
    - cron: '7 17 * * 1-5'
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Fonte: bcb | cafe_milho | soja_boi (vazio = todas)'
        required: false
        default: ''

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache de dependências pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Determinar fonte pelo horário
        id: fonte
        run: |
          FONTE_INPUT="${{ github.event.inputs.fonte }}"
          if [ -n "$FONTE_INPUT" ]; then
            echo "fontes=$FONTE_INPUT" >> $GITHUB_OUTPUT
            echo "label=$FONTE_INPUT (manual)" >> $GITHUB_OUTPUT
            exit 0
          fi

          HORA=$(date -u +%H%M)
          if [ "$HORA" -ge "1215" ] && [ "$HORA" -lt "1300" ]; then
            echo "fontes=bcb cafe_milho" >> $GITHUB_OUTPUT
            echo "label=09h15 BRT (BCB + Café/Milho)" >> $GITHUB_OUTPUT
          elif [ "$HORA" -ge "1317" ] && [ "$HORA" -lt "1400" ]; then
            echo "fontes=soja_boi" >> $GITHUB_OUTPUT
            echo "label=10h17 BRT (Soja + Boi Gordo)" >> $GITHUB_OUTPUT
          else
            echo "fontes=bcb cafe_milho soja_boi" >> $GITHUB_OUTPUT
            echo "label=todas as fontes" >> $GITHUB_OUTPUT
          fi

      - name: Rodar sincronização — ${{ steps.fonte.outputs.label }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for FONTE in ${{ steps.fonte.outputs.fontes }}; do
            echo ""
            echo "▶ Executando fonte: $FONTE"
            python sincronizar.py --fonte $FONTE
          done

      - name: Finalizado
        if: always()
        run: echo "Sincronização finalizada em $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S BRT')"
